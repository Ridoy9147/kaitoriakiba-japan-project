<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 85" width="420" height="85">
  <defs>
    <linearGradient id="akibaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3b30" />
      <stop offset="100%" stop-color="#cc0000" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Phone & Exchange Icon -->
  <g transform="translate(10, 8)">
    <!-- Device Frame -->
    <rect x="0" y="0" width="44" height="70" rx="9" fill="url(#akibaGrad)" filter="url(#shadow)" />
    <!-- Screen -->
    <rect x="3.5" y="6" width="37" height="52" rx="4" fill="#ffffff" />
    <!-- Speaker & Camera -->
    <circle cx="22" cy="3.5" r="1.5" fill="#ffffff" opacity="0.8" />
    <!-- Home Bar / Indicator -->
    <rect x="15" y="63" width="14" height="2" rx="1" fill="#ffffff" opacity="0.8" />
    <!-- Buyback Circular Arrows Symbol inside Screen -->
    <path d="M 22 17 A 11 11 0 0 1 32 28" fill="none" stroke="#ff3b30" stroke-width="3" stroke-linecap="round" />
    <polygon points="32,23 35,29 28,29" fill="#ff3b30" />
    <path d="M 22 47 A 11 11 0 0 1 12 36" fill="none" stroke="#222222" stroke-width="3" stroke-linecap="round" />
    <polygon points="12,41 9,35 16,35" fill="#222222" />
    <!-- Sparkle/Star in center -->
    <path d="M 22 27 L 23.5 30.5 L 27 32 L 23.5 33.5 L 22 37 L 20.5 33.5 L 17 32 L 20.5 30.5 Z" fill="#ffaa00" />
  </g>

  <!-- Brand Typography -->
  <text x="68" y="38" font-family="'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="900" fill="#1a1a1a" letter-spacing="-0.5">
    KAITORI <tspan fill="#ff3b30">AKIBA</tspan>
  </text>
  
  <!-- Badge: 買取アキバ -->
  <rect x="305" y="16" width="85" height="23" rx="4" fill="#ff3b30" />
  <text x="347.5" y="32" font-family="'Hiragino Sans', 'Meiryo', sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">
    買取アキバ
  </text>

  <!-- Tagline -->
  <text x="68" y="58" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#555555" letter-spacing="0.2">
    iPhone &amp; Smartphone Buyback Specialist
  </text>
  <text x="68" y="73" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="500" fill="#888888">
    Tokyo • Akihabara • kaitoriakiba.jp
  </text>
</svg>